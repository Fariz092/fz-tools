<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Brat GIF — FZTools</title>
<link rel="stylesheet" href="../assets/style.css" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  .brat-layout { display: grid; gap: 24px; grid-template-columns: 1fr; }
  @media(min-width: 900px) { .brat-layout { grid-template-columns: 1fr 340px; } }
  
  .preview-wrap {
    border: var(--border);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #222;
    padding: 16px;
  }

  .brat-canvas-wrap {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1 / 1;
    background: #fff;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding-left: 30px; 
  }

  .brat-text {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 80px;
    line-height: 0.95;
    text-align: left;
    word-break: break-word;
    filter: blur(1.5px);
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<header class="nav"><div class="nav__inner">
<a href="../index.html" class="brand"><span class="brand__logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg></span><span class="brand__name">FZTools</span></a>
<nav class="nav__links"><a href="../index.html#tools">TOOLS</a></nav>
</div></header>
<main class="tool-page"><div class="container">
<a href="../index.html" class="back-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>BACK</a>
<h1>Brat GIF Generator</h1>
<p class="tool-page__desc">Bikin stiker Brat animasi (teks muncul perkata). Rasio 1:1, siap pakai WA.</p>

<div class="brat-layout">
  <div class="preview-wrap">
    <div class="brat-canvas-wrap">
      <div id="brat-display" class="brat-text">brat<br>summer</div>
    </div>
  </div>

  <aside class="stack">
    <div>
      <div class="mono muted" style="margin-bottom:6px;">TEKS</div>
      <textarea id="in-text" class="field" style="min-height:100px;">brat
summer</textarea>
    </div>
    <button id="btn-download" class="btn btn--coral btn--full" style="margin-top:12px;">DOWNLOAD GIF</button>
  </aside>
</div>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script>
  const display = document.getElementById('brat-display');
  const inText = document.getElementById('in-text');
  const btnDl = document.getElementById('btn-download');

  let previewTimer = null;
  let previewIndex = 0;
  let currentWords = [];

  function adjustFontSize(len) {
    if (len > 100) return '30px';
    if (len > 50) return '45px';
    if (len > 20) return '60px';
    return '80px';
  }

  function startPreview() {
    if (previewTimer) clearInterval(previewTimer);
    
    const rawText = inText.value.trim();
    if (!rawText) {
      display.textContent = ' ';
      return;
    }

    // Pecah teks jadi kata (perhatikan enter)
    currentWords = rawText.split(/\s+/);
    previewIndex = 0;
    display.style.fontSize = adjustFontSize(rawText.length);

    previewTimer = setInterval(() => {
      if (previewIndex > currentWords.length + 2) { // Jeda ekstra di akhir
        previewIndex = 0;
      }
      
      const visibleCount = Math.min(previewIndex + 1, currentWords.length);
      display.textContent = currentWords.slice(0, visibleCount).join(' ');
      
      previewIndex++;
    }, 250); // Delay sama dengan frame GIF
  }

  inText.addEventListener('input', () => {
    previewIndex = 0;
    startPreview();
  });

  // Fungsi untuk memotong teks panjang (Word Wrap)
  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    const lines = [];

    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      if (ctx.measureText(testLine).width > maxWidth && n > 0) {
        lines.push(line.trim());
        line = words[n] + ' ';
      } else {
        line = testLine;
      }
    }
    lines.push(line.trim());

    let currentY = y - ((lines.length - 1) * lineHeight) / 2;
    lines.forEach(l => {
      ctx.fillText(l, x, currentY);
      currentY += lineHeight;
    });
  }

  btnDl.addEventListener('click', () => {
    try {
      btnDl.textContent = 'MEMPROSES...';
      btnDl.disabled = true;

      const canvas = document.createElement('canvas');
      canvas.width = 400;
      canvas.height = 400;
      const ctx = canvas.getContext('2d');

      // Inisialisasi GIF dengan Worker LOKAL (bukan CDN) untuk mencegah CORS block
      const gif = new GIF({
        workers: 2,
        quality: 10,
        width: 400,
        height: 400,
        workerScript: '../assets/gif.worker.js' // Mengarah ke file lokal
      });

      const rawText = inText.value.trim();
      const words = rawText.split(/\s+/);
      const totalWords = words.length;
      const totalFrames = totalWords + 3;

      const len = rawText.length;
      let fontSize = 80;
      if (len > 100) fontSize = 30;
      else if (len > 50) fontSize = 45;
      else if (len > 20) fontSize = 60;

      // Pre-calculate layout berdasarkan teks PENUH agar Y-position tidak goyang saat animasi
      ctx.font = `700 ${fontSize}px Arial, Helvetica, sans-serif`;
      const lineHeight = fontSize * 0.95;
      const startX = 30;
      const maxWidth = 400 - (startX * 2);

      const fullLines = [];
      let testLine = '';
      for (let n = 0; n < words.length; n++) {
        const t = testLine + words[n] + ' ';
        if (ctx.measureText(t).width > maxWidth && n > 0) {
          fullLines.push(testLine.trim());
          testLine = words[n] + ' ';
        } else {
          testLine = t;
        }
      }
      fullLines.push(testLine.trim());

      const totalHeight = fullLines.length * lineHeight;
      const startY = (400 - totalHeight) / 2 + lineHeight / 2;

      for (let i = 0; i < totalFrames; i++) {
        const visibleCount = Math.min(i + 1, totalWords);
        const visibleText = words.slice(0, visibleCount).join(' ');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 400, 400);

        ctx.fillStyle = '#000000';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.font = `700 ${fontSize}px Arial, Helvetica, sans-serif`;

        wrapText(ctx, visibleText, startX, startY, maxWidth, lineHeight);

        // Efek Blur
        const temp = document.createElement('canvas');
        temp.width = 400;
        temp.height = 400;
        temp.getContext('2d').drawImage(canvas, 0, 0);
        
        ctx.clearRect(0, 0, 400, 400);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 400, 400);
        ctx.filter = 'blur(2px)';
        ctx.drawImage(temp, 0, 0);
        ctx.filter = 'none';

        gif.addFrame(canvas, { delay: 250, copy: true });
      }

      gif.on('finished', function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `brat-gif-${Date.now()}.gif`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        
        btnDl.textContent = 'DOWNLOAD GIF';
        btnDl.disabled = false;
      });

      gif.render();
    } catch (err) {
      console.error(err);
      alert('Gagal export. Cek console untuk detail.');
      btnDl.textContent = 'DOWNLOAD GIF';
      btnDl.disabled = false;
    }
  });

  // Mulai preview otomatis saat halaman dibuka
  startPreview();
</script>
</body>
</html>
