<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Image Squeeze — FZTools</title>
<link rel="stylesheet" href="../assets/style.css" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
<header class="nav"><div class="nav__inner">
<a href="../index.html" class="brand"><span class="brand__logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg></span><span class="brand__name">FZTools</span></a>
<nav class="nav__links"><a href="../index.html#tools">TOOLS</a></nav>
</div></header>
<main class="tool-page"><div class="container">
<a href="../index.html" class="back-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>BACK</a>
<h1>Image Squeeze</h1>
<p class="tool-page__desc">Kompres gambar di browser. Tanpa upload ke server.</p>
<div class="stack">
<label for="ic-file" class="btn btn--paper btn--full" style="cursor:pointer;">PILIH GAMBAR</label>
<input id="ic-file" type="file" accept="image/*" style="display:none;" />
<div><div class="mono muted" style="margin-bottom:6px;">QUALITY: <span id="ic-q-label">70</span>%</div>
<input id="ic-quality" type="range" min="10" max="95" value="70" style="width:100%;accent-color:var(--coral);height:32px;" /></div>
<div id="ic-info" class="mono muted" style="text-align:center;">Belum ada gambar.</div>
<canvas id="ic-canvas" style="width:100%;max-width:320px;aspect-ratio:1;border:var(--border);box-shadow:var(--shadow);display:none;margin:0 auto;object-fit:contain;background:#fff;"></canvas>
<button id="ic-download" class="btn btn--coral btn--full" disabled>DOWNLOAD</button>
</div>
</div></main>
<script src="../assets/app.js"></script>
<script>
const fileEl=$('#ic-file'),qEl=$('#ic-quality'),qLabel=$('#ic-q-label');
const infoEl=$('#ic-info'),canvas=$('#ic-canvas'),dlBtn=$('#ic-download');
let current=null;
fileEl.addEventListener('change',e=>{
const f=e.target.files[0];if(!f)return;
const r=new FileReader();
r.onload=ev=>{const img=new Image();img.onload=()=>{current={img,size:f.size};process();};img.src=ev.target.result;};
r.readAsDataURL(f);
});
function process(){
if(!current)return;
const q=parseInt(qEl.value,10)/100;
qLabel.textContent=qEl.value;
const {img,size}=current;
const max=1600;let w=img.width,h=img.height;
if(w>max||h>max){const rt=Math.min(max/w,max/h);w=Math.round(w*rt);h=Math.round(h*rt);}
canvas.width=w;canvas.height=h;
const ctx=canvas.getContext('2d');
ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
ctx.drawImage(img,0,0,w,h);
canvas.toBlob(blob=>{
if(!blob)return;
const saved=((1-blob.size/size)*100).toFixed(0);
const fmt=n=>n>1048576?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(0)+' KB';
infoEl.innerHTML=`Original: <strong>${fmt(size)}</strong> · Result: <strong>${fmt(blob.size)}</strong> · Saved: <strong>${saved}%</strong>`;
canvas.style.display='block';dlBtn.disabled=false;dlBtn._blob=blob;
},'image/jpeg',q);
}
qEl.addEventListener('input',process);
dlBtn.addEventListener('click',()=>{
const b=dlBtn._blob;if(!b)return;
const u=URL.createObjectURL(b);const a=document.createElement('a');
a.href=u;a.download=`fztools-squeezed-${Date.now()}.jpg`;
document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);
});
</script>
</body>
</html>
